services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: asset-management-backend

    ports:
      - "8000:8000"


    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////data/assets.db}
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key}
      - DEFAULT_LOCATION=${DEFAULT_LOCATION:-APEX HUB}
      - USER_INACTIVITY_DAYS=${USER_INACTIVITY_DAYS:-30}
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-https://assets.apexingoodcompany.co.uk}
      - SMTP_HOST=smtp.mail.ovh.net
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM:-business@apexingoodcompany.co.uk}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}

    volumes:
      - ./backend:/app
      - backend_data:/data

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    networks:
      - asset-network

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /api

    container_name: apex-frontend

    ports:
      - "3001:3000"

    depends_on:
      - backend

    networks:
      - asset-network

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "-",
          "http://localhost:3000"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  asset-network:
    driver: bridge

volumes:
  backend_data:
    external: true
    name: apex-asset-management_backend_data